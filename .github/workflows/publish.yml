on: [push]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubicloud-standard-16
    permissions:
      contents: write
      deployments: write
    name: Build, Test and Publish to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      # npm answers an expired token with a 404 on the tarball, so name the real cause.
      - name: Check npm read token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! npm view @windmill-labs/windmill-react-sdk name; then
            echo "::error::Cannot read the private SDK from npm. If NPM_TOKEN expired, run ./setup-npm-token.sh"
            exit 1
          fi

      - run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Copy worker assets
        run: bash copy_workers.sh

      - name: Build
        run: NODE_OPTIONS=--max_old_space_size=8096 DISABLE_ESLINT_PLUGIN=true npm run build --if-present

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        # Non-blocking: failures are surfaced via annotations and the uploaded
        # screenshots, but must not skip the Deploy step below (a flaky/broken
        # smoke test should never freeze the live demo site).
        continue-on-error: true
        run: npx playwright test

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: tests/*.png

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build
